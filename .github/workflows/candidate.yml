name: GreenCraft Candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "policy.json"
      - ".github/workflows/candidate.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: greencraft-publication
  cancel-in-progress: false

jobs:
  detect-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Resolve mod, metadata and Minecraft updates
        id: prepare
        run: python scripts/prepare_candidate.py

      - name: Validate all client and server downloads
        if: steps.prepare.outputs.changed == 'true'
        run: python scripts/validate_pack.py --online --record

      - name: Serve Candidate for packwiz server smoke-test
        if: steps.prepare.outputs.changed == 'true'
        run: |
          python -m http.server 8000 --directory candidate >/tmp/greencraft-http.log 2>&1 &
          echo $! >/tmp/greencraft-http.pid

      - name: Dedicated server smoke-test
        if: steps.prepare.outputs.changed == 'true'
        run: bash scripts/server_smoke.sh

      - name: Bind server result to tested candidate
        if: steps.prepare.outputs.changed == 'true'
        run: python scripts/validate_pack.py --server-pass

      - name: Mark ready for real GPU test
        if: steps.prepare.outputs.changed == 'true'
        run: python scripts/set_status.py READY_FOR_GPU --folder candidate

      - name: Publish Candidate
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GreenCraft: validated automatic candidate update"
          # Fast-forward only. A concurrent GPU promotion or edit requires rebuilding.
          git push origin HEAD:main

      - name: Optional Discord notification
        if: steps.prepare.outputs.changed == 'true' && success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            python - <<'PY'
          import json, os, urllib.request
          msg={"content":"🟩 GreenCraft: nowa paczka Candidate jest READY_FOR_GPU."}
          req=urllib.request.Request(os.environ["DISCORD_WEBHOOK"],data=json.dumps(msg).encode(),headers={"Content-Type":"application/json"})
          urllib.request.urlopen(req,timeout=15).read()
          PY
          fi

      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greencraft-validation-${{ github.run_id }}
          path: |
            /tmp/greencraft-server.log
            /tmp/greencraft-http.log
            candidate/greencraft-release.json
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          title="GreenCraft pipeline FAILED"
          body="Automatyczny pipeline GreenCraft nie przeszedł kontroli. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            python - <<'PY'
          import json, os, urllib.request
          msg={"content":"🟥 GreenCraft pipeline FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          req=urllib.request.Request(os.environ["DISCORD_WEBHOOK"],data=json.dumps(msg).encode(),headers={"Content-Type":"application/json"})
          urllib.request.urlopen(req,timeout=15).read()
          PY
          fi
