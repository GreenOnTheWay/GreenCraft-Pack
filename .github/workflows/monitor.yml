name: GreenCraft Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  stuck-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check age/status
        id: status
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          p=Path("candidate/greencraft-release.json")
          if not p.exists():
              raise SystemExit(0)
          d=json.loads(p.read_text())
          status=d.get("status","")
          t=d.get("status_updated_at_utc") or d.get("generated_at_utc")
          if not t:
              raise SystemExit(0)
          age=(dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(t)).total_seconds()/3600
          if status in {"READY_FOR_GPU","CANDIDATE","GPU_RETRY"} and age >= 72:
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                  f.write("stuck=true\n")
                  f.write(f"status={status}\n")
                  f.write(f"minecraft={d.get('minecraft','?')}\n")
          PY

      - name: Open/update reminder issue
        if: steps.status.outputs.stuck == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="GreenCraft candidate czeka na interwencję"
          body="Minecraft ${{ steps.status.outputs.minecraft }}, status ${{ steps.status.outputs.status }}, ponad 72 h."
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
